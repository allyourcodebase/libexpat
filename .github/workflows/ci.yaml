name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        zig-version: [latest, master]
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - zig-version: latest
            os: ubuntu-latest
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig-version }}

      - name: Check Formatting
        run: zig fmt --ast-check --check .

      - name: Build
        run: zig build --summary all

      - name: Build (cross-compile BSDs)
        if: matrix.os == 'ubuntu-latest'
        run: |
          zig build -Dtarget=native-freebsd
          zig build -Dtarget=native-netbsd
          zig build -Dtarget=native-openbsd

      - name: Run Tests
        run: zig build test --summary all
